# =====================================================
# ПРАВИЛА МАРШРУТИЗАЦИИ (для агента)
# =====================================================
# Как агент должен выбирать, где искать ответ. Это не код,
# а правила, которые пойдут в README и/или в system prompt агента.
routing_rules:

  - query_type: "функционал"
    example: "какие реквизиты у документа X / как настроить Y"
    target_index: kb
    filters:
      type: [reference, objects, practical]
    description: "Ищем в KB, фильтр по config и section"

  - query_type: "методология"
    example: "как проводить обследование / этапы внедрения"
    target_index: kb
    filters:
      config: universal
      type: [methodology]
    description: "Ищем только в universal-слое"

  - query_type: "сравнение конфигураций"
    example: "чем производство в УНФ отличается от ERP"
    target_index: kb
    filters:
      path_contains: "_cross/"
    description: "Сначала ищем в _cross/, если нет — подтягиваем concept из двух config"

  - query_type: "похожие проекты"
    example: "как делали склад в проектах мебельных производств"
    target_index: kb
    filters:
      type: [case]
      concept: [warehouse, production]
    description: "Ищем кейсы по концептам"

  - query_type: "конкретный проект"
    example: "что мы решили по складу у клиента X"
    target_index: project
    filters:
      project_id: "{{из запроса}}"
    description: "Ищем только в 01_projects/{project_id}/"

  - query_type: "типовое vs проектное"
    example: "как в типовой vs как у клиента"
    target_index: both
    description: "Оба индекса, явно маркировать источник в ответе"
