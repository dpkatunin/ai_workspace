# =====================================================
# ТАКСОНОМИЯ БАЗЫ ЗНАНИЙ 1С
# =====================================================
# Это фундамент всей архитектуры: здесь описаны ВСЕ значения,
# которые могут встречаться в метаданных (frontmatter) файлов базы.
#
# Зачем нужна таксономия
# ----------------------
# Представьте план счетов. Если разрешить бухгалтерам вводить любой счёт —
# через месяц будет хаос. План счетов — это закрытый список, и это правильно.
#
# Таксономия — это то же самое, но для метаданных текстовых файлов.
# Если разрешить агенту классифицировать файлы «как угодно» — RAG-поиск
# будет путать разделы. Закрытый список полей = предсказуемая фильтрация.
#
# Три оси (как в измерении регистра)
# ----------------------------------
# Каждый файл имеет три координаты одновременно:
#   1. config — КАКАЯ конфигурация (unf / erp / universal)
#   2. type   — КАКОЙ это тип (reference / practical / case / ...)
#   3. level  — ГДЕ живёт (kb — общая база, project — артефакты проекта)
#
# Плюс концепт — семантический тег для кросс-поиска.

# =====================================================
# МЕТАДАННЫЕ ФАЙЛА
# =====================================================
version: "1.0"
updated: "2026-10-22"
maintainer: "dpkatunin"
description: "Таксономия полей frontmatter для файлов базы знаний 1С"

# =====================================================
# ОСЬ 1. КОНФИГУРАЦИИ
# =====================================================
# Значения поля `config` в frontmatter.
# Спецзначение `universal` — знания, применимые ко всем конфигурациям
# (методология, шаблоны, общие concepts).
#
# Полные метаданные по каждой конфигурации — в config_registry.yaml.
# Здесь — только перечень допустимых значений (закрытый список).
configs:
  - universal    # применимо ко всем
  - unf          # 1С:Управление нашей фирмой
  - erp          # 1С:ERP Управление предприятием
  - zup          # 1С:Зарплата и управление персоналом
  - bp           # 1С:Бухгалтерия предприятия
  - ka           # 1С:Комплексная автоматизация

# =====================================================
# ОСЬ 2. ТИПЫ ЗНАНИЙ
# =====================================================
# Значения поля `type` в frontmatter.
#
# Тип отвечает на вопрос «КАКОГО РОДА информация в файле».
# Агент выбирает файлы по типу в зависимости от запроса:
#   «какие реквизиты у документа X» → objects
#   «как настроить X» → reference
#   «что пойдёт не так при настройке X» → practical
#   «как делали в похожих проектах» → case
types:

  - id: methodology
    label: "Методология"
    file_suffix: "Методология"
    applicable_configs: [universal]
    description: |
      Этапы внедрения, роли, артефакты по этапам.
      Не зависит от конфигурации — это «как вести проект».
      Пример: «Этапы внедрения 1С», «Роли в проекте», «Какие документы
      должны быть на каждом этапе».

  - id: reference
    label: "Справочник"
    file_suffix: "Справочник"
    applicable_configs: [unf, erp, zup, bp, ka]
    description: |
      Теория и механизмы: как устроена подсистема, как работает механизм,
      в чём разница между сущностями.
      Пример: «Как работает ордерная схема», «Спецификации: что это и зачем».
      Соответствует существующим файлам `_Справочник.md`.

  - id: objects
    label: "Объекты"
    file_suffix: "Объекты"
    applicable_configs: [unf, erp, zup, bp, ka]
    description: |
      Таблицы справочников, документов, регистров, отчётов.
      Какие документы создают движения, какие регистры пишутся.
      Пример: «Документы подсистемы Склад», «Регистры расчётов».
      Соответствует существующим файлам `_Объекты.md`.

  - id: practical
    label: "Практика"
    file_suffix: "Практика"
    applicable_configs: [unf, erp, zup, bp, ka]
    description: |
      Чек-листы для старта, реальные ошибки в формате
      «симптом → причина → решение».
      Пример: «Грабли при вводе остатков», «Чек-лист настройки номенклатуры».
      Соответствует существующим файлам `_Практика.md`.

  - id: case
    label: "Кейс"
    file_suffix: "Кейс"
    applicable_configs: [unf, erp, zup, bp, ka]
    description: |
      Опыт внедрений: контекст, решение, результаты в цифрах.
      Пример: «Мебельное производство: 14 дней на автоматизацию».

  - id: artifact
    label: "Артефакт проекта"
    file_suffix: ""
    applicable_configs: [unf, erp, zup, bp, ka]
    description: |
      Рабочие документы проекта: ТЗ, протоколы встреч, результаты
      обследования, планы. Живут только в 01_projects/{project_id}/.
      Своя схема именования (по этапам), а не общий шаблон.

# =====================================================
# ОСЬ 3. УРОВЕНЬ
# =====================================================
# Значения поля `level` в frontmatter.
# Определяет, в каком индексе (RAG) живёт файл.
#
# Аналогия из 1С: это как разделение «основная база» и «база по конкретному
# клиенту». Один индекс — общие знания, второй — только для одного клиента.
levels:

  - id: kb
    label: "Knowledge Base"
    path_prefix: "00_knowledge_base/"
    description: |
      Переиспользуемые знания. Индексируются в общий RAG-индекс.
      Доступны при любом запросе, если подходят по фильтрам config/type.

  - id: project
    label: "Project"
    path_prefix: "01_projects/"
    description: |
      Артефакты конкретного внедрения. Отдельный индекс на каждый проект
      (по project_id). Не попадают в общий поиск — только при явном
      запросе про этот проект.
      Аналогия: это клиентская база данных, отдельная от типовой.

# =====================================================
# СТАТУСЫ
# =====================================================
# Значения поля `status` в frontmatter.
# Аналогия: это как «Пометка на удаление», только с более тонкой градацией.
statuses:

  - id: actual
    label: "Актуально"
    description: "Проверено, применимо к текущей версии конфигурации."

  - id: draft
    label: "Черновик"
    description: |
      Требует ревью (например, только что извлечён из PDF пайплайном).
      Агент может цитировать, но предупреждает, что это черновик.

  - id: deprecated
    label: "Устарело"
    description: |
      Не удалять — может понадобиться для исторических проектов.
      Агент НЕ цитирует при ответах на общие вопросы, но может
      упомянуть при явном вопросе про историю.

  - id: approved
    label: "Утверждено"
    description: "Для артефактов проекта: согласовано с клиентом/руководителем."

  - id: superseded
    label: "Заменено"
    description: |
      Для артефактов проекта: было заменено более новой версией.
      Сохраняется для истории.

# =====================================================
# РАЗДЕЛЫ
# =====================================================
# Темы внутри конфигураций. Соответствуют разделам в интерфейсе 1С.
#
# Поле `applicable_to` — критически важное для мультиконфигурации.
# Показывает, в каких конфигурациях этот раздел есть.
# Пример: `billing` есть только в УНФ, в ЗУП его нет. Если агент
# запросит «биллинг в ЗУП», фильтр сразу отсечёт — не будет галлюцинаций.
