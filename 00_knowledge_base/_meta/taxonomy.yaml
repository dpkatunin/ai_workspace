# =====================================================
# ЭТАПЫ ВНЕДРЕНИЯ
# =====================================================
# Значения поля `stage` в frontmatter.
# Позволяют фильтровать знания по этапу проекта:
# «я на этапе обследования — что мне почитать?»
#
# Аналогия: это как статусы заказа покупателя — «Заявка → В работе → Выполнен».
# Только для этапов проекта внедрения.
stages:

  - id: pre-project
    label: "Предпроектное обследование"
    description: "Интервью, анализ AS-IS, бизнес-процессы клиента"
    keywords: ["предпроект", "обследован", "интервью", "as-is", "бизнес-анализ"]

  - id: design
    label: "Функциональное моделирование"
    description: "Модель TO-BE, ТЗ, ФТ, проектирование доработок"
    keywords: ["моделирован", "to-be", "функциональн", "тз", "фт", "проектирован"]

  - id: implementation
    label: "Настройка и внедрение"
    description: "Настройка, миграция данных, разработка доработок"
    keywords: ["настро", "внедрен", "реализац", "доработ", "перенос", "миграц"]

  - id: launch
    label: "Запуск"
    description: "Обучение, ОПЭ, ввод в промышленную эксплуатацию"
    keywords: ["запуск", "ввод в эксплуатац", "опытная", "промышленная", "обучен"]

  - id: support
    label: "Сопровождение"
    description: "Поддержка, регламентные работы, доработки"
    keywords: ["сопровожден", "поддержк", "регламент", "закрытие месяца"]

# =====================================================
# КОНЦЕПТЫ — УНИВЕРСАЛЬНЫЙ СЕМАНТИЧЕСКИЙ СЛОЙ
# =====================================================
# Самое важное для кросс-вопросов.
#
# Концепт — это тег «о чём это по смыслу», не зависящий от конфигурации.
# Файл про склад в УНФ и файл про склад в ERP имеют одинаковый
# концепт `warehouse`. Это позволяет агенту на запрос
# «сравни склад в УНФ и ERP» найти оба файла по одному тегу.
#
# Аналогия: это как общий реквизит «Номенклатура» в разных документах.
# Разные документы (Поступление, Реализация, Списание) — но реквизит один,
# и по нему можно собрать все движения.
concepts:

  - id: warehouse
    label: "Склад"
    description: "Хранение, движение, учёт запасов"
    applies_to_configs: [unf, erp, ka]
    cross_file: "warehouse__unf-vs-erp.md"   # имя файла для сравнения (если есть)

  - id: production
    label: "Производство"
    description: "Спецификации, заказы на производство, выпуск, затраты"
    applies_to_configs: [unf, erp]
    cross_file: "production__unf-vs-erp.md"

  - id: sales
    label: "Продажи"
    description: "Заказы клиентов, отгрузка, цены, скидки, бонусы"
    applies_to_configs: [unf, erp, ka]
    cross_file: null

  - id: purchasing
    label: "Закупки"
    description: "Заказы поставщикам, поступление, дополнительные расходы"
    applies_to_configs: [unf, erp, ka]
    cross_file: null

  - id: money
    label: "Деньги"
    description: "Касса, банк, авансовые отчёты, эквайринг, календарь"
    applies_to_configs: [unf, erp, ka]
    cross_file: null

  - id: hr-payroll
    label: "Зарплата и кадры"
    description: "Кадровый учёт, табели, начисления, сдельная оплата"
    applies_to_configs: [unf, zup, erp]
    cross_file: "salary__unf-vs-zup.md"

