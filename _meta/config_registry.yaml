# =====================================================
# РЕЕСТР КОНФИГУРАЦИЙ 1С
# =====================================================
# Метаданные каждой конфигурации, которую поддерживает база знаний.
#
# Зачем нужен отдельный файл
# --------------------------
# В taxonomy.yaml перечислены только id (закрытый список).
# Здесь — расширенная карточка каждой конфигурации: версии, семейство,
# связанные конфигурации, статус наполнения, особые заметки.
#
# Аналогия: это как справочник «Организации» — есть список, а есть
# карточка с реквизитами. Taxonomy содержит id, registry содержит карточку.
#
# Используется:
#   - пайплайном PDF (для определения config по имени файла),
#   - агентом (для понимания, какая версия актуальна),
#   - скриптом kb_lint (для проверки соответствия KB ↔ конфигурация).

version: "1.0"
updated: "2026-10-22"

configs:

  # =====================================================
  # UNIVERSAL — не конфигурация, а слой методологии
  # =====================================================
  - id: universal
    name: "Универсальные знания"
    short: "Universal"
    is_config: false
    description: |
      Методология, шаблоны, concepts — применимы ко всем конфигурациям.
      Лежит в `_universal/`, не привязан к конкретной 1С-ке.
    path: "00_knowledge_base/_universal/"
    status: active
    notes: |
      Наполняется вручную (не через PDF-пайплайн).
      Содержит: этапы внедрения, роли, артефакты, шаблоны документов,
      общий глоссарий concepts.

  # =====================================================
  # УНФ — 1С:Управление нашей фирмой
  # =====================================================
  - id: unf
    name: "1С:Управление нашей фирмой"
    short: "УНФ"
    is_config: true
    family: "business"        # семейство «для малого бизнеса»
    versions:
      current: "3.0"
      supported: ["3.0", "1.6"]
    sections_count: 17
    path: "00_knowledge_base/_configs/unf/"
    status: active            # активно наполняется
    related: [erp, ka, bp]    # родственные конфигурации
    description: |
      Комплексное решение для малого и среднего бизнеса.
      Одна кодовая база с 1С:Розница 3.0 — отличается «видом приложения».
      Содержит 17 разделов: от введения до регламентированного учёта.
    notes: |
      Активно наполняется. Уже есть: 17 разделов × 3 типа (Объекты,
      Практика, Справочник), 15 кейсов внедрения, 15 PDF в обработке.
      Регламентированный учёт — только для ИП на УСН/Патент и ООО на УСН
      (для ООО на ОСНО — синхронизация с 1С:Бухгалтерия).

  # =====================================================
  # ERP — 1С:ERP Управление предприятием
  # =====================================================
  - id: erp
    name: "1С:ERP Управление предприятием"
    short: "ERP"
    is_config: true
    family: "erp"             # семейство «ERP»
    versions:
      current: "2.5"
      supported: ["2.5", "2.4"]
    path: "00_knowledge_base/_configs/erp/"
    status: planned           # запланировано, пока пусто
    related: [ka, unf]
    description: |
      Тяжёлое решение для среднего и крупного бизнеса.
      Включает расширенное производство, бюджетирование, МСФО.
      По сравнению с УНФ — более сложная, больше настроек, но и больше
      возможностей.
    notes: |
      Планируется к наполнению. Приоритетные разделы на старте:
      производство, склад, продажи, закупки, финансы.
      Для кросс-вопросов: `_cross/production__unf-vs-erp.md`,
      `_cross/warehouse__unf-vs-erp.md`.

  # =====================================================
  # ЗУП — 1С:Зарплата и управление персоналом
  # =====================================================
  - id: zup
    name: "1С:Зарплата и управление персоналом"
    short: "ЗУП"
    is_config: true
    family: "hr"
    versions:
      current: "3.1"
      supported: ["3.1"]
    path: "00_knowledge_base/_configs/zup/"
    status: planned
    related: [unf, erp, bp]
    description: |
      Расчёт зарплаты, кадровый учёт, отчётность в СФР и ФНС.
      Используется, когда УНФ не хватает «зарплатного» контура
      (больничные, отпускные, сложные удержания).
    notes: |
      Часто используется совместно с УНФ через синхронизацию.
      Для кросс-вопросов: `_cross/salary__unf-vs-zup.md` — в чём
      разница и когда что использовать.

  # =====================================================
  # БП — 1С:Бухгалтерия предприятия
  # =====================================================
  - id: bp
    name: "1С:Бухгалтерия предприятия"
    short: "БП"
    is_config: true
    family: "accounting"
    versions:
      current: "3.0"
      supported: ["3.0"]
    path: "00_knowledge_base/_configs/bp/"
    status: planned
    related: [unf, erp, zup]
    description: |
      Регламентированный учёт: бухгалтерия, налоги, отчётность.
      Используется вместе с УНФ, когда ООО на ОСНО (УНФ не ведёт
      полноценную бухгалтерию для ООО на ОСНО).
    notes: |
      Часто синхронизируется с УНФ или ERP.
      Раздел «Регламентированный учёт» в УНФ ограничен — для полноценной
      бухгалтерии нужна БП.

  # =====================================================
  # КА — 1С:Комплексная автоматизация
  # =====================================================
  - id: ka
    name: "1С:Комплексная автоматизация"
    short: "КА"
    is_config: true
    family: "erp"
    versions:
      current: "2.5"
      supported: ["2.5"]
    path: "00_knowledge_base/_configs/ka/"
    status: planned
    related: [erp, unf]
    description: |
      Промежуточное решение между УНФ и ERP. Меньше, чем ERP,
      но больше, чем УНФ. Часто используется производственными
      компаниями среднего размера.
    notes: |
      Близка к ERP по структуре, но упрощена.
      Многие файлы из _configs/erp/ будут пересекаться.

# =====================================================
# СЕМЕЙСТВА КОНФИГУРАЦИЙ
# =====================================================
# Группировка по происхождению / назначению.
# Используется для:
#   - кросс-вопросов (легче сравнивать внутри семейства),
#   - маршрутизации (если клиент на «семействе business» — искать в unf, ka),
#   - будущего масштабирования (новые конфигурации добавляются в семейство).
families:

  - id: business
    label: "Малый бизнес"
    configs: [unf]
    description: "Простые решения для небольших компаний"

  - id: erp
    label: "ERP-семейство"
    configs: [erp, ka]
    description: "Тяжёлые решения для среднего и крупного бизнеса"

  - id: accounting
    label: "Бухгалтерия"
    configs: [bp]
    description: "Регламентированный учёт"

  - id: hr
    label: "Кадры и зарплата"
    configs: [zup]
    description: "Управление персоналом и расчёт зарплаты"

# =====================================================
# ПРАВИЛА КРОСС-СРАВНЕНИЯ
# =====================================================
# Какие пары конфигураций имеет смысл сравнивать и по каким concepts.
# Используется для проверки: если _cross/ файл есть, но пары нет
# в этом списке — значит опечатка в имени.
cross_comparisons:

  - pair: [unf, erp]
    concepts: [production, warehouse, sales, purchasing, money]
    reason: "Классический переход УНФ → ERP при росте бизнеса"

  - pair: [unf, zup]
    concepts: [hr-payroll]
    reason: "УНФ не считает сложную зарплату → синхронизация с ЗУП"

  - pair: [unf, bp]
    concepts: [taxes, accounting]
    reason: "УНФ ограничен в регламентированном учёте для ООО на ОСНО"

  - pair: [unf, ka]
    concepts: [production, warehouse]
    reason: "КА — следующий шаг после УНФ для производственников"

  - pair: [erp, ka]
    concepts: [production, warehouse]
    reason: "Похожие решения разного масштаба"

# =====================================================
# ЗАМЕТКИ ПО МАСШТАБИРОВАНИЮ
# =====================================================
# Что делать при добавлении новой конфигурации:
#
#   1. Добавить id в taxonomy.yaml → секция `configs`.
#   2. Добавить запись сюда — в `configs`.
#   3. Создать папку `_configs/{id}/` со структурой:
#        _meta.yaml       ← версия, дата выгрузки, семейство
#        _raw/            ← XML-выгрузка (не индексируется RAG)
#        _metadata/       ← YAML по объектам (генерируется парсером)
#        _indexes/        ← сводные индексы
#        functional/      ← MD-файлы (Справочник)
#        practical/       ← MD-файлы (Практика)
#        objects/         ← MD-файлы (Объекты)
#        cases/           ← MD-файлы (Кейсы)
#   4. Обновить `families` — к какому семейству относится.
#   5. Обновить `cross_comparisons` — с кем сравнивать.
#   6. Написать _cross/{concept}__{a}-vs-{b}.md для ключевых concepts.
#   7. Обновить keywords в taxonomy.yaml для разделов, которые появились
#      в новой конфигурации.
